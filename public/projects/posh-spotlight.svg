<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 1327" width="100%" height="100%">
  <defs>
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1e14"/>
      <stop offset="50%" stop-color="#272b14"/>
      <stop offset="100%" stop-color="#161910"/>
    </linearGradient>
    <radialGradient id="spGlow" cx="50%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#f4c2c9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f4c2c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1088" height="1327" rx="24" fill="url(#spBg)"/>
  <rect width="1088" height="1327" rx="24" fill="url(#spGlow)"/>

  <!-- Clean Data-Driven Spotlight UI -->
  <g transform="translate(80, 100)" font-family="system-ui, -apple-system, sans-serif" fill="#ede1c8">
    <rect width="250" height="44" rx="22" fill="#f4c2c9" fill-opacity="0.2" stroke="#f4c2c9" stroke-width="1.5"/>
    <text x="125" y="28" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5" fill="#f4c2c9">CAMPAIGN SHOWCASE</text>

    <text x="0" y="120" font-size="52" font-weight="800" letter-spacing="-1">Small Budget.</text>
    <text x="0" y="180" font-size="52" font-weight="800" letter-spacing="-1">Strategic Execution.</text>
    <text x="0" y="240" font-size="52" font-weight="800" letter-spacing="-1" fill="#f4c2c9">71 Leads in 6 Days.</text>

    <text x="0" y="300" font-size="22" fill="#b9bd97">Posh Education &amp; Migration Services · UK Study Intake</text>

    <!-- Stat 1: 71 Leads -->
    <g transform="translate(0, 360)">
      <rect width="928" height="160" rx="20" fill="#222612" stroke="#f4c2c9" stroke-width="2"/>
      <text x="50" y="95" font-size="76" font-weight="900" fill="#f4c2c9">71</text>
      <text x="220" y="80" font-size="26" font-weight="700">Verified Study Enquiries</text>
      <text x="220" y="115" font-size="18" fill="#b9bd97">6-day lead-generation push with focused qualification</text>
    </g>

    <!-- Stat 2 & 3: Cost per lead & Spend -->
    <g transform="translate(0, 550)">
      <rect width="450" height="160" rx="20" fill="#222612" stroke="#5a6330" stroke-width="2"/>
      <text x="40" y="85" font-size="50" font-weight="900" fill="#b5cc6a">PKR 66.35</text>
      <text x="40" y="125" font-size="18" font-weight="600" fill="#b9bd97">Cost Per Lead (25% Below Benchmark)</text>
    </g>

    <g transform="translate(478, 550)">
      <rect width="450" height="160" rx="20" fill="#222612" stroke="#5a6330" stroke-width="2"/>
      <text x="40" y="85" font-size="50" font-weight="900" fill="#ede1c8">PKR 4,711</text>
      <text x="40" y="125" font-size="18" font-weight="600" fill="#b9bd97">Total Advertising Spend</text>
    </g>

    <!-- Stat 4 & 5: Views and Viewers -->
    <g transform="translate(0, 740)">
      <rect width="450" height="160" rx="20" fill="#222612" stroke="#b9bd97" stroke-opacity="0.3" stroke-width="2"/>
      <text x="40" y="85" font-size="50" font-weight="900" fill="#ede1c8">68,796</text>
      <text x="40" y="125" font-size="18" font-weight="600" fill="#b9bd97">Total Ad Views</text>
    </g>

    <g transform="translate(478, 740)">
      <rect width="450" height="160" rx="20" fill="#222612" stroke="#b9bd97" stroke-opacity="0.3" stroke-width="2"/>
      <text x="40" y="85" font-size="50" font-weight="900" fill="#ede1c8">44,132</text>
      <text x="40" y="125" font-size="18" font-weight="600" fill="#b9bd97">Unique Targeted Viewers</text>
    </g>

    <!-- Bottom summary tag -->
    <g transform="translate(0, 930)">
      <rect width="928" height="140" rx="20" fill="#5a6330" fill-opacity="0.25" stroke="#f4c2c9" stroke-opacity="0.4" stroke-width="2"/>
      <text x="50" y="60" font-size="22" font-weight="700" fill="#f4c2c9">Audience Matching + Conversion-Focused Creative</text>
      <text x="50" y="100" font-size="17" fill="#b9bd97">Proving that high conversion doesn't require high ad spend, but strategic execution.</text>
    </g>
  </g>
</svg>