    <!-- Card 3: Brand Objectives -->
    <rect x="0" y="760" width="618" height="200" rx="20" fill="#c85a32" fill-opacity="0.18" stroke="#c85a32" stroke-width="2"/>
    <text x="30" y="810" font-size="24" font-weight="700" fill="#c85a32">3. Goal Definition</text>
    <text x="30" y="850" font-size="18" opacity="0.9">Conversion vs. awareness targets</text>
